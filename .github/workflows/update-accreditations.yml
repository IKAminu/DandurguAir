name: Update Home Accreditations

on:
  push:
    paths:
      - '.github/workflows/accreditation-trigger.txt'
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update accreditation boxes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Home.tsx')
          s = p.read_text()
          old = '''          {/* Accreditation placeholders */}
          <div className="border border-dashed border-[var(--color-border)] rounded-xl p-8">
            <p className="text-[11px] font-semibold tracking-widest text-[var(--color-muted)] uppercase mb-6 text-center" style={{ fontFamily: "var(--font-display)" }}>Trusted. Registered. Recognised.</p>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              {["ACCREDITATION 01 — REPLACE", "ACCREDITATION 02 — REPLACE", "AWARD 01 — REPLACE", "AWARD 02 — REPLACE"].map((label) => (
                <div
                  key={label}
                  className="h-16 rounded-lg border-2 border-dashed border-[var(--color-border)] flex items-center justify-center bg-[var(--color-light-grey)]"
                >
                  <span className="text-[11px] text-[var(--color-muted)] text-center px-2 leading-tight">{label}</span>
                </div>
              ))}
            </div>
          </div>'''
          new = '''          {/* Accreditations */}
          <div className="border border-solid border-[var(--color-border)] rounded-xl p-8">
            <p className="text-[11px] font-semibold tracking-widest text-[var(--color-muted)] uppercase mb-6 text-center" style={{ fontFamily: "var(--font-display)" }}>Trusted. Registered. Recognised.</p>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="h-16 rounded-lg border-2 border-solid border-[var(--color-border)] flex items-center justify-center gap-3 bg-[var(--color-light-grey)] px-3">
                <img src="/DandurguAir/images/logo/IATAlogo.png" alt="IATA" className="max-h-10 w-auto max-w-[45%] object-contain" />
                <span className="text-[11px] text-[var(--color-muted)] text-left leading-tight">IATA Accredited Agent</span>
              </div>
              <div className="h-16 rounded-lg border-2 border-solid border-[var(--color-border)] flex items-center justify-center bg-[var(--color-light-grey)] px-2 overflow-hidden">
                <a href="https://b2bhint.com/en/company/ng/dandurgu-air-travel-and-tours-ltd--RC-778913?ref=badge&utm_source=verified-badge&utm_medium=referral" target="_blank" rel="noopener" title="DANDURGU AIR TRAVEL AND TOURS LTD — Verified by B2BHint" style={{ display: "inline-block", lineHeight: 0 }}>
                  <img src="https://b2bhint.com/api/badge/ng/dandurgu-air-travel-and-tours-ltd--RC-778913.svg" alt="DANDURGU AIR TRAVEL AND TOURS LTD — Verified by B2BHint · Registry health score" width={248} height={64} loading="lazy" style={{ border: 0, maxWidth: "100%" }} />
                </a>
              </div>
              <div className="h-16 rounded-lg border-2 border-solid border-[var(--color-border)] flex items-center justify-center gap-3 bg-[var(--color-light-grey)] px-3">
                <img src="/DandurguAir/images/logo/NAHCONlogo.png" alt="NAHCON" className="max-h-10 w-auto max-w-[45%] object-contain" />
                <span className="text-[11px] text-[var(--color-muted)] text-left leading-tight">NAHCON Member</span>
              </div>
              <div className="h-16 rounded-lg border-2 border-solid border-[var(--color-border)] flex items-center justify-center gap-3 bg-[var(--color-light-grey)] px-3">
                <img src="/DandurguAir/images/logo/NANTAlogo.png" alt="NANTA" className="max-h-10 w-auto max-w-[45%] object-contain" />
                <span className="text-[11px] text-[var(--color-muted)] text-left leading-tight">NANTA</span>
              </div>
            </div>
          </div>'''
          if old not in s:
              raise SystemExit('Target accreditation block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Home.tsx
          git diff --cached --quiet || git commit -m "Update accreditation section"
          git push
